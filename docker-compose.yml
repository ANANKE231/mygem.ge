services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE: ${R2_PUBLIC_BASE:-}
      FLITT_MERCHANT_ID: ${FLITT_MERCHANT_ID:-}
      FLITT_PAYMENT_KEY: ${FLITT_PAYMENT_KEY:-}
      FLITT_CREDIT_KEY: ${FLITT_CREDIT_KEY:-}
      APP_PUBLIC_BASE: ${APP_PUBLIC_BASE:-https://mygem.ge}
      COMPANY_NAME: ${COMPANY_NAME:-მიკრო მეწარმე გიორგი მინდიაშვლი}
      COMPANY_ID: ${COMPANY_ID:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-574173203}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-mygemge@gmail.com}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-თბილისი, საქართველო}
      COMPANY_IBAN: ${COMPANY_IBAN:-GE56TB7046245064300117}
