services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mygem
      POSTGRES_USER: mygem
      POSTGRES_PASSWORD: mygem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygem -d mygem"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mygem
      SPRING_DATASOURCE_USERNAME: mygem
      SPRING_DATASOURCE_PASSWORD: mygem
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      APP_TOKEN_SECRET: change-this-secret-before-a-public-deploy
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
