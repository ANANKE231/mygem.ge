<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>mygem.ge — ადმინი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<style>
   /* ადმინის პანელი და ავტორიზაცია */
html {
  scrollbar-gutter: stable;
}

.app > *,
.topbar > *,
.ph > *,
.ed > *,
.two > * {
  min-width: 0;
}

input,
textarea,
select {
  max-width: 100%;
}

button,
.btn,
.nv,
.lnk {
  touch-action: manipulation;
}

.login {
  min-height: 100dvh;
  padding: 24px 16px;
}

.lcard {
  max-width: 400px;
  padding: 28px 24px;
  border-radius: 20px;
}

.lcard input {
  min-height: 46px;
}

.lcard .btn {
  min-height: 46px;
}

.lcard .eye {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
}

.lerr:empty {
  display: none;
}

main {
  width: 100%;
  margin-inline: auto;
}

.topbar {
  flex-wrap: wrap;
}

.modal .box {
  max-height: calc(100dvh - 32px);
  overscroll-behavior: contain;
}

.modal.drawer .box {
  height: 100dvh;
  max-height: 100dvh;
}

@media (max-width: 860px) {
  .side {
    gap: 4px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    overscroll-behavior-x: contain;
  }

  .side .nv {
    flex: 0 0 76px;
    width: 76px;
    min-height: 58px;
    padding: 8px 4px;
    font-size: 10px;
  }

  .topbar {
    padding: 12px;
    gap: 10px;
  }

  .gs {
    flex: 1 1 100%;
    width: 100%;
  }

  .gs input {
    min-height: 46px;
    font-size: 16px;
  }

  main {
    padding: 20px 12px
      calc(110px + env(safe-area-inset-bottom));
  }

  .ph {
    align-items: stretch;
    gap: 12px;
  }

  .ph h1 {
    font-size: 22px;
    overflow-wrap: anywhere;
  }

  .ph .btn,
  .mf .btn,
  .row-a .btn {
    min-height: 44px;
  }

  .modal {
    padding: 12px;
  }

  .modal .box {
    padding: 20px 16px;
    max-height: calc(100dvh - 24px);
  }

  .modal.drawer .box {
    max-width: 100%;
    height: 100dvh;
    max-height: 100dvh;
  }

  .mh h2 {
    font-size: 19px;
    overflow-wrap: anywhere;
  }

  .mf,
  .row-a {
    flex-wrap: wrap;
    gap: 10px;
  }

  .mf > .btn,
  .row-a > .btn {
    flex: 1 1 140px;
    justify-content: center;
  }

  .toast {
    left: 12px;
    right: 12px;
    bottom: calc(90px + env(safe-area-inset-bottom));
    width: auto;
  }
}

@media (max-width: 480px) {
  .lcard {
    padding: 24px 18px;
  }

  .lcard h1 {
    font-size: 24px;
  }

  .lcard input,
  .lcard select,
  .lcard textarea {
    font-size: 16px;
  }

  .modal .row-a {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .modal .row-a > .btn {
    width: 100%;
  }

  .gal {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
:root{
 --navy:#000080;--navy-h:#1A1AA3;--navy-d:#00005C;--soft:#EEF0FF;--soft2:#F6F7FF;
 --bg:#F4F5FA;--card:#fff;--line:#E7E9F1;--line2:#F0F2F7;
 --tx:#161A23;--tx2:#475467;--mu:#7B8499;
 --ok:#12A150;--ok-s:#E4F6EB;--warn:#C98A00;--warn-s:#FFF4D6;--err:#C0453F;--err-s:#FDECEA;--hold:#7C4DDB;--hold-s:#EFE9FC;--gold:#D9B45F;
 --r:14px;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);--sh2:0 24px 64px rgba(16,24,40,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans Georgian",system-ui,Arial,sans-serif;font-size:14.5px;color:var(--tx);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}
button{font:inherit;color:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:20px 14px 16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 20px}
.brand .lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--navy-h),var(--navy-d));box-shadow:0 6px 16px rgba(0,0,128,.28)}
.brand .lg svg{width:21px;height:21px}
.brand b{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:var(--mu);font-size:12px}
.grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:#A0A8BA;padding:16px 12px 6px}
.nv{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:11px;background:none;color:var(--tx2);cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nv svg{width:19px;height:19px}
.nv:hover{background:#F3F4F8;color:var(--tx)}
.nv.on{background:var(--soft);color:var(--navy);font-weight:600}
.nv.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--navy)}
.nv .bd{margin-left:auto;background:var(--err);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;min-width:20px;text-align:center}
.me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:14px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mu)}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--navy);font-weight:700}
.me div{min-width:0}.me b{display:block;color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me a{text-decoration:none;font-weight:500}.me a:hover{text-decoration:underline}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 32px;background:rgba(244,245,250,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.gs{position:relative;flex:1;max-width:620px;margin-left:auto}
.gs .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu);pointer-events:none}
.gs input{padding:10px 56px 10px 40px;border-radius:12px;background:#fff}
.gs kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px inherit;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#F9FAFB}
.gsr{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);max-height:70vh;overflow:auto;display:none;padding:6px}
.gsr.show{display:block}
.gsr h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#A0A8BA;padding:10px 10px 4px}
.gsr a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--tx);text-decoration:none;cursor:pointer}
.gsr a:hover,.gsr a.sel{background:var(--soft)}
.gsr small{color:var(--mu);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
main{padding:28px 32px 90px;max-width:1320px;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ===== page head ===== */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.2px}
.ph p{color:var(--mu);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ===== controls ===== */
input,select,textarea{font:inherit;border:1px solid #D5D9E4;border-radius:10px;padding:9px 12px;background:#fff;width:100%;color:var(--tx);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,0,128,.1)}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:13px;color:var(--tx2);font-weight:500}
label>input,label>select,label>textarea{margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--navy-h);border-color:var(--navy-h);box-shadow:0 4px 12px rgba(0,0,128,.25)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:#fff;color:var(--tx);border-color:#D5D9E4}.btn.alt:hover{background:#F9FAFC;border-color:var(--navy);box-shadow:none}
.btn.red{background:#fff;color:var(--err);border-color:#F2C4C0}.btn.red:hover{background:var(--err);border-color:var(--err);color:#fff;box-shadow:none}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.ok:hover{background:#0E8A44;border-color:#0E8A44}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.ic{padding:8px;aspect-ratio:1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .fld{position:relative;flex:1;min-width:230px;max-width:420px}
.toolbar .fld svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mu);pointer-events:none}
.toolbar .fld input{padding-left:38px}
.toolbar select{width:auto;min-width:170px}
.count{color:var(--mu);font-size:13px;margin-left:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--tx2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip em{font-style:normal;color:var(--mu);margin-left:7px;font-size:12px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on em{color:rgba(255,255,255,.75)}

/* ===== cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
.card>h2,.ch{font-size:16px;font-weight:600;margin-bottom:4px}
.card>.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.kp{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.kp:hover{transform:translateY(-2px);border-color:var(--c,var(--navy));box-shadow:0 10px 26px rgba(16,24,40,.09)}
.kp i{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--bg2,var(--soft));color:var(--c,var(--navy))}
.kp i svg{width:22px;height:22px}
.kp b{display:block;font-size:26px;line-height:1.1;font-weight:700}.kp small{color:var(--mu);font-size:13px}
.alert{display:flex;align-items:center;gap:14px;background:var(--warn-s);border:1px solid #F1DDA0;color:#6B4E00;border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.alert svg{width:22px;height:22px;flex:none}
.alert .btn{margin-left:auto}
.split{display:flex;height:12px;border-radius:8px;overflow:hidden;background:#EEF0F6;margin:8px 0 14px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--tx2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--c)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.li{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line2);cursor:pointer;border-radius:8px}
.li:first-of-type{border-top:0}.li:hover{background:var(--soft2)}.li b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li small{color:var(--mu);margin-left:auto;white-space:nowrap}

/* ===== tables ===== */
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .tw{border:0;box-shadow:none;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);background:#FAFBFD;white-space:nowrap;font-weight:600;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-top:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:background .12s}tbody tr:hover td{background:var(--soft2)}
tr.clk{cursor:pointer}
td .t{font-weight:600;text-decoration:none;color:var(--tx)}td .t:hover{color:var(--navy)}
td .sub{color:var(--mu);font-size:12.5px}
.th{width:48px;height:48px;border-radius:11px;background:#EEF0F6 center/cover no-repeat;border:1px solid var(--line)}
.row-a{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-active{background:var(--ok-s);color:#0B7A3E}.t-expired{background:var(--warn-s);color:#8A5E00}.t-off{background:#EEF0F4;color:#545D70}.t-blocked{background:var(--err-s);color:#A2322C}.t-hold{background:var(--hold-s);color:#5E33B5}
.tag.vip{background:var(--soft);color:var(--navy)}.tag.vip::before{display:none}
.pager{display:flex;gap:6px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}
.pager button:hover{border-color:var(--navy)}.pager button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{padding:44px 20px;text-align:center;color:var(--mu)}
.empty svg{width:42px;height:42px;color:#C5CADA;margin-bottom:10px}
.empty b{display:block;color:var(--tx2);font-weight:600;margin-bottom:4px}
.hint{font-size:13px;color:var(--mu);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 .full{grid-column:1/-1}

/* ===== payments ===== */
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:22px}
.pay{background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.pay .am{font-size:26px;font-weight:700;color:var(--navy)}
.pay .pt{font-weight:600}.pay small{color:var(--mu)}
.pay .row-a{margin-top:8px}

/* ===== notes ===== */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.note{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column}
.note h3{font-size:15px;margin:4px 0}.note p{white-space:pre-wrap;color:var(--tx2);margin:6px 0 12px;word-break:break-word;font-size:14px}.note small{color:var(--mu)}.note .row-a{margin-top:auto}

/* ===== blog ===== */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.post{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.post:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(16,24,40,.1)}
.post .cv{aspect-ratio:3/2;background:#EEF0F6 center/cover no-repeat}
.post .pb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.post .pb b{font-size:15.5px;line-height:1.4}.post small{color:var(--mu)}
.post .pb p{color:var(--tx2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .row-a{margin-top:auto;padding-top:10px}
.add-card{border:2px dashed #C7CBE0;border-radius:var(--r);min-height:260px;display:grid;place-items:center;color:var(--mu);background:transparent;cursor:pointer;transition:all .15s;text-align:center;padding:20px}
.add-card:hover{border-color:var(--navy);color:var(--navy);background:var(--soft2)}
.add-card .pl{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--navy);display:grid;place-items:center;margin:0 auto 10px}
.add-card .pl svg{width:26px;height:26px}
.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,128,.38);cursor:pointer;z-index:30;transition:transform .15s,background .15s}
.fab:hover{background:var(--navy-h);transform:scale(1.07)}.fab svg{width:26px;height:26px}
.info{background:#FFFBEF;border:1px solid #F0E2B6;color:#6B5A1E;border-radius:var(--r);padding:14px 18px;margin-bottom:18px;font-size:13.5px}
.info b{color:#4D3F0F}
.info code,.hint code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:5px;font-size:12.5px}
.ed{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.editbar{position:sticky;top:64px;z-index:15;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;box-shadow:var(--sh)}
.editbar .ttl{font-weight:600;margin-right:auto}
.cover{display:block;border:2px dashed #C7CBE0;border-radius:12px;aspect-ratio:3/2;background:#FAFBFF center/cover no-repeat;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.cover:hover,.cover.drag{border-color:var(--navy)}
.cover span{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;color:var(--mu);padding:10px;background:rgba(250,251,255,.6)}
.cover span svg{width:30px;height:30px}
.cover.has span{opacity:0;transition:opacity .2s;color:#fff;background:rgba(0,0,0,.5)}.cover.has:hover span{opacity:1}
.tb{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.tb button{display:inline-flex;align-items:center;gap:6px;border:1px solid #D5D9E4;background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px}.tb button svg{width:15px;height:15px}.tb button:hover{border-color:var(--navy);color:var(--navy)}
#bb{min-height:340px;line-height:1.65}
.lblrow{display:flex;justify-content:space-between;align-items:baseline}.lblrow small{color:var(--mu);font-weight:400}
.pv{position:sticky;top:132px;max-height:calc(100vh - 160px);overflow:auto;font-size:15px;line-height:1.75}
.pv .pcov{aspect-ratio:3/2;border-radius:10px;background:#EEF0F6 center/cover no-repeat;margin-bottom:14px}.pv .pcov.empty{display:grid;place-items:center;color:var(--mu);padding:0}
.pv h1{font-size:23px;line-height:1.3;margin-bottom:6px}.pv .meta{color:var(--mu);font-size:13px;margin-bottom:12px}.pv h3{font-size:17px;margin:18px 0 6px}.pv p{margin-bottom:10px}.pv ul{padding-left:22px;margin-bottom:10px}

.info.warn{background:#FFF4D6;border-color:#F1DDA0;color:#6B4E00}.info.good{background:#E4F6EB;border-color:#B8E5C8;color:#0B6B37}
.pulse{border-color:var(--warn)!important;box-shadow:0 0 0 4px rgba(201,138,0,.18)}
.bdg{position:absolute;top:10px;left:10px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.bdg.ok{background:rgba(228,246,235,.95);color:#0B7A3E}.bdg.new{background:rgba(255,244,214,.96);color:#8A5E00}
.post .cv{position:relative}
.post .pb b{font-size:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% -10%,#E4E7FF 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#FBF3DE 0,transparent 55%),var(--bg)}
.lcard{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 30px 26px;box-shadow:var(--sh2);text-align:center;animation:pop .25s}
.lcard .lg{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--navy-h),var(--navy-d));box-shadow:0 10px 24px rgba(0,0,128,.3)}.lcard .lg svg{width:28px;height:28px}
.lcard h1{font-size:22px}.lcard form{display:grid;gap:14px;margin-top:20px;text-align:left}
.pw{position:relative;margin-top:5px}.pw input{padding-right:44px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:7px;color:var(--mu);cursor:pointer;border-radius:8px}.pw .eye:hover{color:var(--navy);background:var(--soft)}.pw .eye svg{width:18px;height:18px;display:block}
.lerr{min-height:20px;color:var(--err);font-size:13px;font-weight:500}
.lnk{display:block;margin:12px auto 0;border:0;background:none;color:var(--navy);font-size:13.5px;cursor:pointer;text-decoration:none}.lnk:hover{text-decoration:underline}
/* ===== definition list (details) ===== */
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin:22px 0 8px}
.dl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dr{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:9px 14px;border-top:1px solid var(--line2);font-size:14px}
.dr:first-child{border-top:0}.dr dt{color:var(--mu)}.dr dd{word-break:break-word;min-width:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;transition:transform .15s}.gal img:hover{transform:scale(1.03)}

/* ===== modal / drawer ===== */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(4px);display:none;place-items:center;padding:16px;z-index:50}
.modal.show{display:grid;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal .box{background:#fff;border-radius:18px;padding:26px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--sh2);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
.modal img{max-width:100%;border-radius:8px}
.modal.drawer{place-items:stretch end;padding:0}
.modal.drawer .box{max-width:760px;height:100vh;max-height:100vh;border-radius:0;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.mh h2{font-size:20px;line-height:1.3}
.mf{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.toast{position:fixed;right:22px;bottom:22px;display:flex;align-items:center;gap:10px;background:#101828;color:#fff;padding:12px 18px;border-radius:12px;z-index:80;box-shadow:var(--sh2);animation:rise .25s}
.toast svg{width:18px;height:18px;color:#6EE7A8}
.gate{max-width:480px;margin:12vh auto;text-align:center;padding:36px}
.gate .lg{width:58px;height:58px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--navy-h),var(--navy-d))}
.gate .lg svg{width:28px;height:28px}

/* ===== responsive ===== */
@media(max-width:1100px){.ed,.two{grid-template-columns:1fr}.pv{position:static;max-height:none}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:40;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:2px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;box-shadow:0 -6px 20px rgba(16,24,40,.07)}
 .brand,.grp,.me{display:none}
 .nv{flex-direction:column;gap:3px;padding:7px 10px;font-size:11px;min-width:64px;justify-content:center;text-align:center}
 .nv svg{width:21px;height:21px}.nv.on::before{display:none}.nv .bd{position:absolute;top:2px;right:8px;margin:0;font-size:10px;min-width:16px;padding:0 5px}
 .topbar{position:static;padding:12px 16px}.gs{max-width:none}.gs kbd{display:none}.gs input{padding-right:12px}
 main{padding:18px 16px 110px}.grid2{grid-template-columns:1fr}
 .ph h1{font-size:21px}.fab{bottom:86px;right:18px}
 .dr{grid-template-columns:1fr;gap:2px}
 .editbar{top:8px}.pv{top:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
