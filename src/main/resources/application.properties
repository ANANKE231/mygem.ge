spring.application.name=mygem

spring.datasource.url=jdbc:postgresql://db.elrqvfytuybxozwzqhbd.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.tomcat.max-http-form-post-size=40MB
server.tomcat.max-swallow-size=40MB
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

app.token-secret=${APP_TOKEN_SECRET:}
app.token-days=14
app.admin-emails=mygemge@gmail.com
app.google-client-id=${GOOGLE_CLIENT_ID:}
app.r2-access-key-id=${R2_ACCESS_KEY_ID:}
app.r2-secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2-endpoint=${R2_ENDPOINT:}
app.r2-bucket=${R2_BUCKET:}
app.r2-public-base=${R2_PUBLIC_BASE:}
server.port=8081
