spring.application.name=mygem

# Local default. Override with SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, and SPRING_DATASOURCE_DRIVER_CLASS_NAME for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/mygem;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.tomcat.max-http-form-post-size=40MB
server.tomcat.max-swallow-size=40MB
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

app.token-secret=${APP_TOKEN_SECRET:dev-only-change-me-mygem-ge-secret-key}
app.token-days=14
app.admin-emails=mygemge@gmail.com
